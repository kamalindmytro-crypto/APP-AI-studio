<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini 3 Web App Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for Code Viewer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/xml.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#000000',
                            card: 'rgba(28, 28, 30, 0.75)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            blue: '#0A84FF',
                            green: '#30D158',
                            red: '#FF453A',
                            gray: '#8E8E93',
                            lightBg: '#F2F2F7',
                            lightCard: 'rgba(255, 255, 255, 0.8)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom iOS Glassmorphism and Scrollbar tweaks */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #000;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-input:focus {
            border-color: #0A84FF;
            outline: none;
        }
        /* Hide scrollbars for clean iOS look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center bg-zinc-950 text-white">

    <!-- Mobile Screen Frame Container -->
    <div id="phone-frame" class="relative w-full h-full sm:max-w-[420px] sm:h-[880px] sm:rounded-[50px] sm:border-[8px] sm:border-zinc-800 bg-black flex flex-col overflow-hidden shadow-2xl transition-all duration-300">
        
        <!-- iOS Dynamic Island -->
        <div class="relative w-full pt-3 pb-1 flex justify-center items-center z-50 select-none">
            <div id="dynamic-island" class="w-28 h-7 bg-black rounded-full border border-zinc-800/60 flex items-center justify-between px-3 transition-all duration-300">
                <div class="w-2.5 h-2.5 rounded-full bg-zinc-900 flex items-center justify-center">
                    <div class="w-1 h-1 rounded-full bg-blue-500 animate-pulse"></div>
                </div>
                <div id="island-status" class="text-[10px] text-zinc-400 font-medium truncate max-w-[100px]">Готовий</div>
            </div>
        </div>

        <!-- iOS Top Header Bar -->
        <div class="px-5 py-2 flex items-center justify-between border-b border-white/10 glass z-40">
            <div class="flex items-center gap-2">
                <i class="fa-solid font-bold text-lg bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Gemini Studio</i>
            </div>
            <!-- New Session / Reset Button -->
            <button onclick="startNewSession()" class="px-3 py-1.5 rounded-full bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs font-semibold border border-red-500/30 transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-rotate-right text-[10px]"></i>
                <span>Нова сесія</span>
            </button>
        </div>

        <!-- TAB CONTENT CONTAINER -->
        <div class="flex-1 relative overflow-hidden">

            <!-- TAB 1: GENERATOR / CHAT -->
            <div id="tab-generator" class="tab-page absolute inset-0 flex flex-col p-4 space-y-3 overflow-hidden">
                <!-- Chat Message List -->
                <div id="chat-list" class="flex-1 overflow-y-auto space-y-3 pr-1 no-scrollbar">
                    <div class="glass p-3.5 rounded-2xl border border-white/10 text-sm leading-relaxed text-zinc-300">
                        <div class="flex items-center gap-2 mb-1 text-xs text-blue-400 font-semibold">
                            <i class="fa-solid fa-sparkles"></i> AI Асистент
                        </div>
                        Вітаю! Я збережу контекст нашої розмови. Опишіть веб-додаток, і ми будемо вдосконалювати його крок за кроком в цій сесії!
                    </div>
                </div>

                <!-- Input Box Area -->
                <div class="glass p-2.5 rounded-2xl flex flex-col gap-2 border border-white/10">
                    <textarea id="prompt-input" rows="2" placeholder="Опишіть додаток або правки..." class="glass-input w-full p-2.5 rounded-xl text-sm text-white placeholder-zinc-500 resize-none no-scrollbar"></textarea>
                    <div class="flex items-center justify-between">
                        <div class="text-[11px] text-zinc-400 flex items-center gap-1">
                            <span id="active-key-indicator" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                            <span id="active-model-name" class="truncate max-w-[140px]">gemini-3.8-flash</span>
                        </div>
                        <button onclick="generateOrUpdateApp()" id="send-btn" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs flex items-center gap-1.5 transition active:scale-95 shadow-lg shadow-blue-600/30">
                            <span>Надіслати</span>
                            <i class="fa-solid fa-paper-plane text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- TAB 2: SANDBOX / PREVIEW -->
            <div id="tab-sandbox" class="tab-page absolute inset-0 hidden flex-col bg-white">
                <div class="p-2 bg-zinc-900 border-b border-white/10 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-2 text-zinc-400">
                        <span class="w-2 h-2 rounded-full bg-green-500"></span>
                        <span>Інтерактивний Sandbox</span>
                    </div>
                    <button onclick="reloadPreview()" class="px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 hover:bg-zinc-700 active:scale-95 text-[11px]">
                        <i class="fa-solid fa-rotate-right mr-1"></i>Оновити
                    </button>
                </div>
                <iframe id="preview-frame" class="w-full flex-1 border-none bg-white" title="App Preview"></iframe>
            </div>

            <!-- TAB 3: CODE VIEWER -->
            <div id="tab-code" class="tab-page absolute inset-0 hidden flex-col bg-zinc-950">
                <div class="p-2.5 glass border-b border-white/10 flex items-center justify-between">
                    <span class="text-xs text-zinc-400 font-mono">index.html</span>
                    <div class="flex gap-2">
                        <button onclick="copyCode()" class="px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium border border-white/10 active:scale-95">
                            <i class="fa-regular fa-copy mr-1"></i>Копіювати
                        </button>
                        <button onclick="downloadCode()" class="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium active:scale-95 shadow">
                            <i class="fa-solid fa-download mr-1"></i>Скачати
                        </button>
                    </div>
                </div>
                <div class="flex-1 overflow-auto p-3 no-scrollbar font-mono text-xs">
                    <pre><code id="code-block" class="language-html text-zinc-300"><!-- Код буде відображено тут --></code></pre>
                </div>
            </div>

            <!-- TAB 4: KEYS & SETTINGS -->
            <div id="tab-settings" class="tab-page absolute inset-0 hidden flex-col p-4 space-y-4 overflow-y-auto no-scrollbar">
                <div class="glass p-4 rounded-2xl border border-white/10 space-y-3">
                    <h3 class="text-sm font-semibold text-zinc-200 flex items-center gap-2">
                        <i class="fa-solid fa-microchip text-blue-400"></i> Модель Gemini
                    </h3>
                    <select id="model-select" onchange="updateModelSelection()" class="glass-input w-full p-2.5 rounded-xl text-xs text-white bg-zinc-900 border-white/15">
                        <option value="gemini-3.8-flash">gemini-3.8-flash (Рекомендована)</option>
                        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Швидка)</option>
                        <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (Потужна)</option>
                    </select>
                </div>

                <div class="glass p-4 rounded-2xl border border-white/10 space-y-3">
                    <h3 class="text-sm font-semibold text-zinc-200 flex items-center gap-2">
                        <i class="fa-solid fa-key text-amber-400"></i> Ключі Gemini API (до 5)
                    </h3>
                    <div id="key-inputs-list" class="space-y-2">
                        <!-- Key Inputs Dynamic Generation -->
                    </div>
                </div>
            </div>

        </div>

        <!-- iOS Bottom Tab Bar Navigation -->
        <div class="px-4 py-2 border-t border-white/10 glass flex justify-around items-center z-40">
            <button onclick="switchTab('generator')" id="nav-generator" class="nav-btn flex flex-col items-center gap-1 text-blue-400">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                <span class="text-[10px] font-medium">Студія</span>
            </button>
            <button onclick="switchTab('sandbox')" id="nav-sandbox" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
                <i class="fa-solid fa-play text-lg"></i>
                <span class="text-[10px] font-medium">Прев'ю</span>
            </button>
            <button onclick="switchTab('code')" id="nav-code" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
                <i class="fa-solid fa-code text-lg"></i>
                <span class="text-[10px] font-medium">Код</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span class="text-[10px] font-medium">Налаштування</span>
            </button>
        </div>

    </div>

    <script>
        // --- APP STATE ---
        let currentCode = "";
        let chatHistory = [];
        let apiKeys = ["", "", "", "", ""];
        let activeKeyIndex = 0;
        let selectedModel = "gemini-3.8-flash";

        // System prompt ensuring continuity and contextual modifications
        const SYSTEM_PROMPT = `Ви досвідчений веб-розробник. Ваше завдання — створювати або редагувати однофайлові веб-додатки (HTML + Tailwind CSS + JS).
ЯКЩО КОД ВЖЕ ІСНУЄ: Вносьте правки, виправлення або доповнення користувача безпосередньо в існуючий код, зберігаючи робочу логіку та стилі.
ОБОВ'ЯЗКОВО повертайте ПОВНИЙ оновлений код веб-додатка від початку до кінця в одному файлі index.html у форматованому блоці \`\`\`html ... \`\`\` чи у чистому HTML без зайвого пояснювального тексту.`;

        // --- INIT ---
        window.onload = () => {
            loadSettings();
            renderKeyInputs();
            updatePreview();
        };

        // --- NAVIGATION ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-page').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-blue-400');
                el.classList.add('text-zinc-500');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('flex');
            
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-zinc-500');
            activeNav.classList.add('text-blue-400');

            if (tabId === 'code') {
                renderCodeViewer();
            }
        }

        // --- NEW SESSION (RESET CONTEXT) ---
        function startNewSession() {
            if (chatHistory.length > 0 || currentCode !== "") {
                chatHistory = [];
                currentCode = "";
                
                // Clear UI Chat
                const chatList = document.getElementById('chat-list');
                chatList.innerHTML = `
                    <div class="glass p-3.5 rounded-2xl border border-white/10 text-sm leading-relaxed text-zinc-300">
                        <div class="flex items-center gap-2 mb-1 text-xs text-blue-400 font-semibold">
                            <i class="fa-solid fa-sparkles"></i> AI Асистент
                        </div>
                        Розпочато нову сесію! Контекст і попередній код очищено. Введіть новий запит для створення нового додатка.
                    </div>
                `;
                
                updatePreview();
                renderCodeViewer();
                updateIsland("Новий проект", "bg-blue-500");
            }
        }

        // --- API & GENERATION LOGIC ---
        async function generateOrUpdateApp() {
            const inputEl = document.getElementById('prompt-input');
            const userPrompt = inputEl.value.trim();
            if (!userPrompt) return;

            const apiKey = getActiveApiKey();
            if (!apiKey) {
                appendChatMessage("Система", "Будь ласка, вкажіть хоча б один API ключ у вкладці Налаштування.", "text-red-400");
                switchTab('settings');
                return;
            }

            // Display user message in chat
            appendChatMessage("Ви", userPrompt, "text-white");
            inputEl.value = "";
            setLoading(true);
            updateIsland("Генерація...", "bg-amber-500 animate-ping");

            // Format contents including system prompt & context
            const contents = [
                { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
                ...chatHistory,
                { role: "user", parts: [{ text: currentCode ? `Поточний код додатка:\n\`\`\`html\n${currentCode}\n\`\`\`\n\nЗапит користувача на зміни: ${userPrompt}` : userPrompt }] }
            ];

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || "Помилка API Gemini");
                }

                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                // Extract HTML block
                const extractedCode = extractHtmlCode(aiText);

                if (extractedCode) {
                    currentCode = extractedCode;
                    
                    // Maintain Chat History for ongoing context
                    chatHistory.push({ role: "user", parts: [{ text: userPrompt }] });
                    chatHistory.push({ role: "model", parts: [{ text: `Код успішно оновлено. [Версія додатка оновлена]` }] });

                    appendChatMessage("AI Асистент", "Правки внесено! Перегляньте оновлений веб-додаток у вкладці Прев'ю або Код.", "text-blue-400");
                    updatePreview();
                    updateIsland("Оновлено", "bg-emerald-500");
                } else {
                    appendChatMessage("AI Асистент", aiText, "text-zinc-300");
                    updateIsland("Готово", "bg-blue-500");
                }

            } catch (err) {
                console.error(err);
                appendChatMessage("Помилка", err.message || "Не вдалося отримати відповідь.", "text-red-400");
                updateIsland("Помилка", "bg-red-500");
            } finally {
                setLoading(false);
            }
        }

        function extractHtmlCode(text) {
            const match = text.match(/```html\s*([\s\S]*?)\s*```/);
            if (match && match[1]) {
                return match[1].trim();
            }
            if (text.trim().startsWith("<!DOCTYPE") || text.trim().startsWith("<html")) {
                return text.trim();
            }
            return null;
        }

        // --- UI HELPERS ---
        function appendChatMessage(sender, text, colorClass) {
            const chatList = document.getElementById('chat-list');
            const msgEl = document.createElement('div');
            msgEl.className = "glass p-3 rounded-2xl border border-white/10 text-xs leading-relaxed space-y-1";
            msgEl.innerHTML = `
                <div class="font-semibold ${colorClass}">${sender}</div>
                <div class="text-zinc-300 whitespace-pre-wrap">${escapeHtml(text)}</div>
            `;
            chatList.appendChild(msgEl);
            chatList.scrollTop = chatList.scrollHeight;
        }

        function updatePreview() {
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = currentCode || `
                <html>
                    <body style="background:#121212; color:#888; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
                        <p style="text-align:center;">Немає згенерованого коду.<br/>Надішліть запит у Студії для створення додатка.</p>
                    </body>
                </html>
            `;
        }

        function reloadPreview() {
            updatePreview();
        }

        function renderCodeViewer() {
            const codeBlock = document.getElementById('code-block');
            codeBlock.textContent = currentCode || "<!-- Код ще не згенеровано -->";
            hljs.highlightElement(codeBlock);
        }

        function updateIsland(text, indicatorClass) {
            const islandStatus = document.getElementById('island-status');
            islandStatus.textContent = text;
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('send-btn');
            btn.disabled = isLoading;
            btn.style.opacity = isLoading ? "0.6" : "1";
        }

        // --- SETTINGS & MULTI-KEY MANAGEMENT ---
        function getActiveApiKey() {
            return apiKeys[activeKeyIndex] || apiKeys.find(k => k.trim() !== "") || "";
        }

        function renderKeyInputs() {
            const container = document.getElementById('key-inputs-list');
            container.innerHTML = "";
            
            apiKeys.forEach((key, idx) => {
                const isSelected = idx === activeKeyIndex;
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";
                div.innerHTML = `
                    <button onclick="selectActiveKey(${idx})" class="w-6 h-6 rounded-full border border-white/20 flex items-center justify-center text-[10px] ${isSelected ? 'bg-blue-600 text-white border-blue-400' : 'bg-zinc-800 text-zinc-400'}">
                        ${idx + 1}
                    </button>
                    <input type="password" value="${key}" onchange="updateKey(${idx}, this.value)" placeholder="API Ключ #${idx + 1}" class="glass-input flex-1 p-2 rounded-xl text-xs text-white placeholder-zinc-600 font-mono">
                `;
                container.appendChild(div);
            });
        }

        function selectActiveKey(idx) {
            activeKeyIndex = idx;
            renderKeyInputs();
            saveSettings();
        }

        function updateKey(idx, val) {
            apiKeys[idx] = val.trim();
            saveSettings();
        }

        function updateModelSelection() {
            selectedModel = document.getElementById('model-select').value;
            document.getElementById('active-model-name').textContent = selectedModel;
            saveSettings();
        }

        function saveSettings() {
            localStorage.setItem('gemini_studio_keys', JSON.stringify(apiKeys));
            localStorage.setItem('gemini_studio_active_key_idx', activeKeyIndex);
            localStorage.setItem('gemini_studio_model', selectedModel);
        }

        function loadSettings() {
            const savedKeys = localStorage.getItem('gemini_studio_keys');
            if (savedKeys) apiKeys = JSON.parse(savedKeys);

            const savedIdx = localStorage.getItem('gemini_studio_active_key_idx');
            if (savedIdx !== null) activeKeyIndex = parseInt(savedIdx, 10);

            const savedModel = localStorage.getItem('gemini_studio_model');
            if (savedModel) {
                selectedModel = savedModel;
                document.getElementById('model-select').value = savedModel;
                document.getElementById('active-model-name').textContent = savedModel;
            }
        }

        // --- UTILS ---
        function copyCode() {
            if (!currentCode) return;
            navigator.clipboard.writeText(currentCode).then(() => {
                alert("Код успішно скопійовано!");
            });
        }

        function downloadCode() {
            if (!currentCode) return;
            const blob = new Blob([currentCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
